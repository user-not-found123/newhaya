<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .love-text {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px #ff69b4;
            z-index: 1;
        }
    </style>
</head>

<body>

    <canvas id="heartCanvas"></canvas>

    <div class="love-text">I love you ❤️</div>

    <script>
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawHeart();
        }

        function drawHeart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 40;

            const scale = Math.min(
                canvas.width / 40,
                canvas.height / 45,
                12
            );

            ctx.fillStyle = "#ffb6c1";
            ctx.shadowColor = "#ff69b4";
            ctx.shadowBlur = 8;

            // Draw the heart using dots
            for (let s = 11; s <= 16; s++) {
                for (let i = 0; i < 120; i++) {
                    const angle = i * (Math.PI * 2) / 120;

                    const x =
                        16 * Math.pow(Math.sin(angle), 3) * s;

                    const y = (
                        13 * Math.cos(angle)
                        - 5 * Math.cos(2 * angle)
                        - 2 * Math.cos(3 * angle)
                        - Math.cos(4 * angle)
                    ) * s;

                    ctx.beginPath();

                    ctx.arc(
                        centerX + x * scale / 16,
                        centerY - y * scale / 16,
                        2.5,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }

            ctx.shadowBlur = 0;
        }

        // Redraw when the screen size changes
        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
    </script>

</body>
</html>
